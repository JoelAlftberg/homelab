entryPoints:
  websecure:
    address: ":443"
    http:
      middlewares:
        - internal-only@file
      tls:
        certResolver: cf
        domains:
          - main: alftberg.net
            sans:
              - "*.alftberg.net"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true
  docker:
    endpoint: tcp://socket-proxy:2375
    exposedByDefault: false
    network: internal

certificatesResolvers:
  cf:
    acme:
      email: joel@alftberg.net
      storage: /etc/traefik/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - 1.1.1.1:53

accessLog:
  format: json

log:
  level: INFO
