http:
  routers:
    vpn-gui:
      rule: Host(`vpn-gui.alftberg.net`)
      entryPoints:
        - websecure
      service: wg-easy
      tls:
        certResolver: cf

  services:
    wg-easy:
      loadBalancer:
        servers:
          - url: http://wg-easy:51821

