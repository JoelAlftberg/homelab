---
- name: Create persistent data directories on vdb
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /mnt/storage/gitlab/config
    - /mnt/storage/gitlab/logs
    - /mnt/storage/gitlab/data

- name: Start GitLab container
  containers.podman.podman_container:
    name: gitlab
    image: docker.io/gitlab/gitlab-ce:19.2.7-ce.0
    network: "{{ podman_network }}"
    state: started
    restart_policy: always
    volumes:
      - "/mnt/storage/gitlab/config:/etc/gitlab:Z"
      - "/mnt/storage/gitlab/logs:/var/log/gitlab:Z"
      - "/mnt/storage/gitlab/data:/var/opt/gitlab:Z"
    env:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.alftberg.net'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        nginx['proxy_set_headers'] = {
          "X-Forwarded-Proto" => "https",
          "X-Forwarded-Ssl" => "on"
        }
        gitlab_rails['initial_root_password'] = "change_this_after_first_boot"
    labels:
      traefik.enable: "true"
      traefik.http.routers.gitlab.rule: Host(`gitlab.alftberg.net`)
      traefik.http.services.gitlab.loadbalancer.server.port: "80"
