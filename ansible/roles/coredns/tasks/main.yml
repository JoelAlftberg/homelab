---
- name: Create storage for CoreDNS
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /mnt/storage/coredns

- name: Render CoreDNS Corefile from template
  ansible.builtin.template:
    src: Corefile.j2
    dest: /mnt/storage/coredns/Corefile
    mode: '0644'

- name: Copy CoreDNS zone file for alftberg.net
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/coredns/templates/alftberg.net.zone"
    dest: "/mnt/storage/coredns/alftberg.net.zone"
    mode: '0644'

- name: Start CoreDNS container
  containers.podman.podman_container:
    name: coredns
    image: docker.io/coredns/coredns:latest
    state: started
    restart_policy: always
    command: "-conf /etc/coredns/Corefile"
    pull: missing
    network: host
    volumes:
      - "/mnt/storage/coredns:/etc/coredns:Z"
