---
# --- KVM / QEMU setup ---

- name: Install KVM, QEMU and virt-manager tools
  ansible.builtin.package:
    name:
      - qemu-kvm # Hypervisor
      - libvirt # Control plane API and background service, virsh
      - bridge-utils # Network bridging
      - virt-install # CLI tool for provisioning new VMs
      - virt-manager # GUI for managing the VMs
      - virt-viewer # View console for VMs
      - podman
    state: present

- name: Ensure libvirtd service is enabled and started
  ansible.builtin.service:
    name: libvirtd
    state: started
    enabled: yes

- name: Add current user to the libvirt group
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups:
      - libvirt
    append: yes

# --- Terraform setup ---

- name: Add official HashiCorp repository 
  ansible.builtin.yum_repository:
    name: hashicorp
    description: HashiCorp Stable RPMs
    baseurl: https://rpm.releases.hashicorp.com/fedora/$releasever/$basearch/stable
    enabled: yes
    gpgcheck: yes
    gpgkey: https://rpm.releases.hashicorp.com/gpg

- name: Install Terraform CLI
  ansible.builtin.dnf:
    name: terraform
    state: present
    update_cache: yes

