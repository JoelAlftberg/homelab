---
- name: Change aardvark dns port
  ansible.builtin.ini_file:
    path: /etc/containers/containers.conf
    section: network
    option: "dns_bind_port"
    value: "1053"

- name: Disable stub listener and set CoreDNS as DNS for host
  community.general.ini_file:
    path: /etc/systemd/resolved.conf
    section: Resolve
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: '0644'
  loop:
    - { option: 'DNSStubListener', value: 'no' }
    - { option: 'DNS', value: '10.22.1.101' }
    - { option: 'Domains', value: '~alftberg.net'}

- name: Network
  containers.podman.podman_network:
    name: "{{ podman_network }}"

- name: Ensure systemd-resolved service is running and enabled
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted 
    enabled: true

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted

- name: Install podman
  ansible.builtin.package:
    name: 
      - podman
    state: present
