- name: Create storage for traefik
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /mnt/storage/traefik/config
    - /mnt/storage/traefik/acme

- name: Copy configs
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/traefik/{{ traefik_name }}/"
    dest: "/mnt/storage/traefik-{{ traefik_name }}/config"
    mode: "0644"
  notify: restart traefik

- name: Require the token
  ansible.builtin.assert:
    that: cloudflare_api_token | length > 0

- name: Cloudflare token
  containers.podman.podman_secret:
    name: cf_dns_token
    data: "{{ cloudflare_api_token }}"
    force: true
  no_log: true

- name: Network
  containers.podman.podman_network:
    name: "{{ traefik_network }}"
  when: traefik_network is defined

- name: Start Traefik container
  containers.podman.podman_container:
    name: traefik-{{ traefik_name }}
    image: docker.io/library/traefik:latest
    state: started
    restart_policy: always
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    network: "{{ [traefik_network] if traefik_network is defined else omit }}"
    network_alias:
      - "{{ ['treafik-{{ traefik_name }}'] if traefik_network is defined else omit }}"
    ports:
      - "{{ traefik_publish }}"
    volumes: 
      - "/mnt/storage/traefik-{{ traefik_name }}/config:/etc/traefik:Z"
      - "{% if traefik_socket | default(false) %}/run/podman/podman.sock:/var/run/docker.sock:ro{% endif %}"
    secrets:
      - cf_dns_token,type=env,target=CF_DNS_API_TOKEN
    command:
      - "--configfile=/etc/traefik/traefik.yml"
