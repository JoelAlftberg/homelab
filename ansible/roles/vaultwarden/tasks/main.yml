---
- name: Create storage for vaultwarden 
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /mnt/storage/vaultwarden/data

- name: Start vaultwarden container
  containers.podman.podman_container:
    name: vaultwarden
    image: docker.io/vaultwarden/server:latest
    network: homelab-net
    network_alias:
      - vaultwarden
    state: started
    restart_policy: always
    volumes:
      - "/mnt/storage/vaultwarden/data:/data:Z"
