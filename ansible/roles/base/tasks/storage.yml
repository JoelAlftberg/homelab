- name: Ensure LVM and persistent storage are configured on vdb
  block:
    - name: Install packages
      ansible.builtin.package:
        name:
          - xfsprogs # For formating persistent disk
        state: present

    - name: Initialize vdb as physical volume
      community.general.lvg:
        vg: vg_homelab
        pvs: /dev/vdb
        state: present

    - name: Create logical volume for homelab data
      community.general.lvol:
        vg: vg_homelab
        lv: lv_data
        size: 100%VG

    - name: Create XFS filesystem on LV
      community.general.filesystem:
        fstype: xfs
        dev: /dev/vg_homelab/lv_data

    - name: Ensure mount point directory exists
      ansible.builtin.file:
        path: /mnt/storage
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Mount the LV
      ansible.posix.mount:
        path: /mnt/storage
        src: /dev/vg_homelab/lv_data
        fstype: xfs
        opts: defaults,nofail
        state: mounted
