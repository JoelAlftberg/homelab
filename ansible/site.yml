---
- name: Obtain ephemeral SSH keys
  hosts: localhost
  gather_facts: false
  become: false
  roles:
    - ssh_ephemeral

- name: Configure Service Host
  hosts: services
  become: true
  roles:
    - podman
    - base
    - socket-proxy
    - traefik
    - vaultwarden
    - vault
    - gitlab

- name: Configure Utility Host
  hosts: utility
  become: true
  roles:
    - podman
    - coredns
    - wireguard
    - traefik

- name: Clean up ephemeral key
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Remove temp directory
      ansible.builtin.file:
        path: "{{ ssh_ephemeral_dir }}"
        state: absent
      when: ssh_ephemeral_dir is defined
