---
- name: Configure Service Host
  hosts: services
  become: true
  roles:
    - podman
    - base
    - socket-proxy
    - traefik
    - vaultwarden
    - vault
#    - gitlab

- name: Configure Utility Host
  hosts: utility
  become: true
  roles:
    - podman
    - coredns
    - wireguard
    - traefik
