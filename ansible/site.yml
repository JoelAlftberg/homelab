---
- name: Prompt for deployment variables
  hosts: all
  gather_facts: false
  vars_prompt:
    - name: ssh_key_path
      prompt: "Enter the path to the Day-0 Terraform private key"
      private: false
      default: "~/.ssh/id_rsa"
    
    - name: gitlab_initial_pass
      prompt: "Enter the initial password for @root in gitlab"
      private: true
      confirm: true
      default: "change_this_after_first_boot"

    - name: cloudflare_api_token
      prompt: "Enter the Cloudflare API token"
      private: true
      default: ""

    - name: wg_password
      prompt: "Enter the WireGuard password"
      private: true
      confirm: true

  tasks:
    - name: Pass variables to host groups
      ansible.builtin.set_fact:
        ansible_ssh_private_key_file: "{{ ssh_key_path }}"
        gitlab_root_pass: "{{ gitlab_initial_pass }}"
        cloudflare_api_token: "{{ cloudflare_api_token }}"
        wg_password: "{{wg_password }}"
        cacheable: true

